name: Unzip
on:
  push:
    paths: ['*.zip']
permissions:
  contents: write
  actions: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit
        run: |
          unzip -o AmberPad.zip -x "__MACOSX/*"
          rm AmberPad.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unzip project"
          git push
      - name: Start APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml
